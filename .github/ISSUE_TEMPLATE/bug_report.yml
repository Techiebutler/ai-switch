name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real tokens, `auth.json`, Keychain output or credential files here.** Redact emails if you like.
        Security problems go to the [Security tab](https://github.com/Techiebutler/ai-switch/security) instead.
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options: [Claude Code, Codex CLI, Cursor, All / not tool specific]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The exact command you ran and its full output.
      render: console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ai-switch version
      placeholder: output of `ai-switch --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and tool version
      placeholder: "macOS 15.5, Claude Code 2.1.0"
    validations:
      required: true
